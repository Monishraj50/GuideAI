<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Atrium.AI favicon — mirrors the sidebar logo at 32×32.
    A stylized "A" with an oculus dot at its apex (the central opening
    of an atrium that lets light in), on a soft gradient tile.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#5cf2c0"/>
      <stop offset="100%" stop-color="#a98cf2"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Glyph stroked in dark for max contrast at tiny sizes -->
  <g stroke="#0e1116" stroke-width="2.6" stroke-linecap="round" fill="none">
    <!-- Left wall -->
    <path d="M7 25 L16 7"/>
    <!-- Right wall -->
    <path d="M25 25 L16 7"/>
    <!-- Crossbeam -->
    <path d="M11 19 L21 19"/>
  </g>
  <!-- Oculus -->
  <circle cx="16" cy="11" r="1.9" fill="#0e1116"/>
</svg>
