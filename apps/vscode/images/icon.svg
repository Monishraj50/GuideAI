<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Atrium "A" mark: two diagonal walls + crossbeam + oculus dot (the
       central opening at the top of a Roman atrium). Single color so VS Code
       can theme it dark/light automatically. -->
  <path d="M3.5 21 L12 4.2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M20.5 21 L12 4.2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M7.5 14.5 L16.5 14.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
  <circle cx="12" cy="8.6" r="1.55" fill="currentColor"/>
</svg>
